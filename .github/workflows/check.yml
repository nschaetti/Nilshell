name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: uv sync --frozen
        working-directory: engine
      - run: uv run pytest && uv run ruff check .
        working-directory: engine
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run desktop build -- --no-bundle
  sandbox-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv sync --frozen
        working-directory: engine
      - run: uv run pytest tests/test_tools.py::test_actual_linux_sandbox -v
        working-directory: engine
        env:
          NILSHELL_REQUIRE_SANDBOX: '1'
      - run: uv run pyinstaller --noconfirm --onefile --name nilshell-engine --collect-all keyring --collect-all jsonschema_specifications main.py
        working-directory: engine
      - run: NILSHELL_TEST_ENGINE="$PWD/dist/nilshell-engine" uv run pytest tests/test_rpc.py -v
        working-directory: engine
        env:
          NILSHELL_REQUIRE_SANDBOX: '1'
