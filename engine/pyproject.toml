[project]
name = "nilshell-engine"
version = "0.1.0"
description = "Local desktop engine for Nilshell"
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.28,<1", "keyring>=25,<26", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "pyinstaller>=6.11,<7", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
